name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Using a stable Python version suitable for PyInstaller
        cache: pip

    - name: Install system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Prepare bundled FFmpeg
      run: python scripts/prepare_ffmpeg.py

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name DOT-${{ runner.os }} src/app.py

    # after pyinstaller builds the application verify, that the expected file exists
    - name: Verify build output
      shell: bash
      run: |
          test -f "dist/DOT-${{ runner.os }}${{ runner.os == 'Windows' && '.exe' || ''}}"
          test -f "ffmpeg/ffmpeg${{ runner.os == 'Windows' && '.exe' || ''}}"

    - name: Prepare release package
      shell: bash
      run: |
          mkdir package
          cp "dist/DOT-${{ runner.os }}${{ runner.os == 'Windows' && '.exe' || ''}}" package/
          cp -r ffmpeg package/

    - name: Create release archive
      run: python scripts/package_release.py "DOT-${{ runner.os }}.zip"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DOT-${{ runner.os }}
        path: DOT-${{ runner.os }}.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # Only run on tags
    permissions:
      contents: write
    
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
